# Standalone local/validation configuration; never overlay onto production.
services:
  passwordforge:
    platform: linux/amd64
    build:
      context: .
    image: passwordforge:${PASSWORDFORGE_DEV_TAG:-dev-1.0.0}
    restart: "no"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    network_mode: bridge
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
