# Independent installation with an operator-managed TLS proxy; use alone.
services:
  passwordforge:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: "${KEYSMITH_IMAGE:-passwordforge:1.0.0-local}"
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${KEYSMITH_PROXY_NETWORK:?Set KEYSMITH_PROXY_NETWORK to your dedicated proxy network}"
      traefik.http.routers.keysmith.rule: "Host(`${KEYSMITH_DOMAIN:?Set KEYSMITH_DOMAIN to your DNS name}`)"
      traefik.http.routers.keysmith.entrypoints: "${KEYSMITH_HTTPS_ENTRYPOINT:-websecure}"
      traefik.http.routers.keysmith.tls: "true"
      traefik.http.routers.keysmith.tls.certresolver: "${KEYSMITH_CERT_RESOLVER:?Set KEYSMITH_CERT_RESOLVER to an existing resolver}"
      traefik.http.routers.keysmith.service: keysmith
      traefik.http.services.keysmith.loadbalancer.server.port: "8080"
      traefik.http.services.keysmith.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.keysmith.loadbalancer.healthcheck.interval: 30s
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
networks:
  proxy:
    name: "${KEYSMITH_PROXY_NETWORK:?Set KEYSMITH_PROXY_NETWORK to your dedicated proxy network}"
    external: true
