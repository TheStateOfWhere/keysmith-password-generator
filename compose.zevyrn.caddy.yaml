# Complete alternative: use alone, never as an overlay.
name: zevyrn-caddy
services:
  zevyrn:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: zevyrn:1.2.0-local
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    networks: [app]
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    # The official binary has a NET_BIND_SERVICE file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      ZEVYRN_DOMAIN: "${ZEVYRN_DOMAIN:-${KEYSMITH_DOMAIN:?Set ZEVYRN_DOMAIN or KEYSMITH_DOMAIN in .env}}"
    ports:
      - "${ZEVYRN_BIND_IP:-${KEYSMITH_BIND_IP:?Set ZEVYRN_BIND_IP or KEYSMITH_BIND_IP in .env}}:443:8443/tcp"
    networks: [app]
    depends_on:
      zevyrn:
        condition: service_healthy
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,mode=0700,uid=65532,gid=65532
      - /config:rw,noexec,nosuid,size=16m,mode=0700,uid=65532,gid=65532
    volumes:
      - type: bind
        source: ./examples/caddy/Caddyfile.zevyrn
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ZEVYRN_TLS_DIR:-${KEYSMITH_TLS_DIR:?Set an absolute external ZEVYRN_TLS_DIR or KEYSMITH_TLS_DIR}}"
        target: /certs
        read_only: true
        bind:
          create_host_path: false
networks:
  app:
    driver: bridge
